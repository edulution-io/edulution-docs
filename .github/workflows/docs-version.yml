name: Cut docs version

# The documentation has its own release rhythm: a snapshot is cut when the
# state of `docs/` is worth freezing, not whenever edulution ships. Started by
# hand, never by another repository.
#
# The label is the month the snapshot was cut in, counted from zero within that
# month, like the site's own release tags. A second snapshot in the same month
# is therefore `2026.10.1` and leaves `2026.10.0` readable instead of replacing
# it.
#
# Which edulution version a snapshot describes, and which milestone it belongs
# to, are not derivable from a date, so the person cutting it says. Both end up
# in the release notes, the version also in the commit.

on:
  workflow_dispatch:
    inputs:
      edulution_version:
        description: 'Documented edulution version (e.g. 2.3)'
        required: true
      notes:
        description: 'What this snapshot changes, in German — it becomes the release notes'
        required: true
      milestone:
        description: 'Milestone this snapshot belongs to (e.g. Release 2.4) — empty takes the only open one'
        required: false

permissions:
  contents: read

concurrency:
  group: docs-version
  cancel-in-progress: false

jobs:
  cut:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read
    outputs:
      version: ${{ steps.cut.outputs.version }}
      milestone: ${{ steps.milestone.outputs.title }}
      milestone_url: ${{ steps.milestone.outputs.url }}
    steps:
      # First, so a name that does not exist costs nothing: an unknown
      # milestone would otherwise be found out after the snapshot was already
      # committed, and the release notes would carry a dangling link. An empty
      # input takes the only open milestone — the normal case — and refuses to
      # guess when there are several.
      - name: Resolve the milestone
        id: milestone
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MILESTONE: ${{ inputs.milestone }}
        run: |
          set -euo pipefail
          milestones=$(gh api "repos/$GH_REPO/milestones?state=all&per_page=100")

          if [ -n "$MILESTONE" ]; then
            title="$MILESTONE"
            url=$(jq -r --arg title "$title" 'map(select(.title == $title)) | .[0].html_url // empty' <<< "$milestones")
            if [ -z "$url" ]; then
              echo "::error::$GH_REPO has no milestone named '$title'."
              exit 1
            fi
          else
            open=$(jq -c 'map(select(.state == "open"))' <<< "$milestones")
            if [ "$(jq -r 'length' <<< "$open")" != '1' ]; then
              echo "::error::$(jq -r 'length' <<< "$open") open milestones in $GH_REPO — name the one this snapshot belongs to."
              exit 1
            fi
            title=$(jq -r '.[0].title' <<< "$open")
            url=$(jq -r '.[0].html_url' <<< "$open")
          fi

          echo "title=$title" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "::notice::Snapshot belongs to the milestone $title."

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cut the version
        id: cut
        run: |
          set -euo pipefail
          month=$(TZ=Europe/Berlin date +%Y.%-m)

          # The highest snapshot of this month, or -1 when it is the first.
          # `docs:version` unshifts onto versions.json, so the new label has to
          # be the highest one there is, or the site would roll backwards.
          n=-1
          if [ -f versions.json ]; then
            n=$(jq -r --arg prefix "$month." \
              '[.[] | select(startswith($prefix)) | split(".")[2] | select(test("^[0-9]+$")) | tonumber] | max // -1' \
              versions.json)
          fi

          version="$month.$((n + 1))"
          npx docusaurus docs:version "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "::notice::Cut the documentation snapshot $version."

      # Both builds, because the one that is deployed is the one the version
      # options can break: it leaves the development version out. A snapshot
      # that fails here never reaches main, so main is never left with a
      # version that cannot be released.
      - name: Verify the snapshot builds
        run: |
          set -euo pipefail
          npm run build
          DOCS_INCLUDE_NEXT=true npm run build -- --out-dir build-check

      - name: Commit to main
        env:
          VERSION: ${{ steps.cut.outputs.version }}
          EDULUTION_VERSION: ${{ inputs.edulution_version }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add versions.json versioned_docs versioned_sidebars
          git commit -m "Publish the documentation snapshot $VERSION for edulution $EDULUTION_VERSION"
          git push origin main

  # The site is only ever deployed from a release tag, and a push made with GITHUB_TOKEN triggers no
  # workflow, so the snapshot reaches readers through a release of its own rather than through a deploy.
  release:
    needs: cut
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Start the release
        env:
          VERSION: ${{ needs.cut.outputs.version }}
          EDULUTION_VERSION: ${{ inputs.edulution_version }}
          NOTES: ${{ inputs.notes }}
          MILESTONE: ${{ needs.cut.outputs.milestone }}
          MILESTONE_URL: ${{ needs.cut.outputs.milestone_url }}
        run: |
          set -euo pipefail
          gh workflow run release.yml --ref main \
            -f "docs_version=$VERSION" \
            -f "edulution_version=$EDULUTION_VERSION" \
            -f "notes=$NOTES" \
            -f "milestone=$MILESTONE" \
            -f "milestone_url=$MILESTONE_URL"
