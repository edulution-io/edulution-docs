name: Deploy Docusaurus to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  # Called by `docs-version.yml`: a push made with GITHUB_TOKEN does not
  # trigger the `push` trigger above, so a freshly cut version would never
  # reach the site on its own.
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref_name }}"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # An absolute /docs/ link resolves to whichever version is served, not
      # to the one being read. Frozen into a snapshot it silently moves the
      # reader to another version, and onBrokenLinks cannot see it because
      # the target does exist.
      - name: Reject absolute /docs/ links in docs/
        run: |
          if grep -rnE '\]\(/docs/' docs/; then
            echo "::error::Absolute /docs/-Links sind nicht versionssicher. Relativen .md-Link verwenden."
            exit 1
          fi

      # The deployed build leaves the development version out, which would
      # also stop onBrokenLinks/onBrokenAnchors from checking the files people
      # actually edit. This build is only there to check them.
      - name: Check the development version
        env:
          DOCS_INCLUDE_NEXT: 'true'
        run: npm run build -- --out-dir build-check

      - name: Build website
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: ${{ github.ref_name == 'main' && 'github-pages' || 'dev-preview' }}
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
