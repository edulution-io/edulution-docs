name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Builds before tagging, so a broken main never becomes a release that cannot be deployed.
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Releases are cut from main, not from ${{ github.ref_name }}"
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

  release:
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: write
      actions: write

    concurrency:
      group: release

    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      # CalVer: v<year>.<month>.<n>, n counting from 0 within the month.
      - name: Determine the version
        id: version
        run: |
          prefix="v$(TZ=Europe/Berlin date +%Y.%-m)"
          last=$(gh api "repos/$GH_REPO/git/matching-refs/tags/$prefix." --jq '.[].ref | sub("^refs/tags/"; "")' \
            | grep -E "^${prefix//./\\.}\.[0-9]+$" | sort -V | tail -n 1)
          if [[ -z $last ]]
          then
            tag="$prefix.0"
          else
            tag="$prefix.$(( ${last##*.} + 1 ))"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # A release created with GITHUB_TOKEN triggers no `release` event, so the deploy is started explicitly,
      # on the tag, which is the only ref the github-pages environment accepts.
      - name: Create the release and deploy it
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          previous=$(gh release list --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // empty')
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes \
            ${previous:+--notes-start-tag "$previous"}
          gh workflow run static.yml --ref "$TAG"
          echo "Released $TAG from $GITHUB_SHA and started the deploy." >> "$GITHUB_STEP_SUMMARY"
