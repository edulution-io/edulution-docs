name: Release

on:
  workflow_dispatch:
    inputs:
      docs_version:
        description: 'Documentation snapshot this release publishes — empty for a redeploy that cuts none'
        required: false
      edulution_version:
        description: 'edulution version the snapshot documents'
        required: false
      notes:
        description: 'What the snapshot changes, in German'
        required: false

permissions:
  contents: read

jobs:
  # Builds before tagging, so a broken main never becomes a release that cannot be deployed.
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Releases are cut from main, not from ${{ github.ref_name }}"
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

  release:
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: write
      actions: write

    concurrency:
      group: release

    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # CalVer: <year>.<month>.<n>, n counting from 0 within the month. The atomic push fails if main moved after the
      # verified commit, so neither the version commit nor the tag lands with an unbuilt change.
      # A release created with GITHUB_TOKEN triggers no `release` event, so the deploy is started explicitly,
      # on the tag, which is the only ref the github-pages environment accepts.
      # The notes carry what the tag cannot say: which documentation snapshot
      # this release publishes, and which edulution version that snapshot
      # describes. `docs-version.yml` passes both; a redeploy started by hand
      # passes neither and gets the generated notes alone.
      - name: Release and deploy
        env:
          DOCS_VERSION: ${{ inputs.docs_version }}
          EDULUTION_VERSION: ${{ inputs.edulution_version }}
          NOTES: ${{ inputs.notes }}
        run: |
          month=$(TZ=Europe/Berlin date +%Y.%-m)
          n=$(gh api "repos/$GH_REPO/git/matching-refs/tags/v$month." \
            --jq '[.[].ref | split(".")[-1] | select(test("^[0-9]+$")) | tonumber] | max // -1')
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          tag=$(npm version "$month.$((n + 1))" -m "Release v%s")
          git push --atomic origin HEAD:main "$tag"
          previous=$(gh release list --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // empty')
          if [ -n "$previous" ]; then
            generated=$(gh api "repos/$GH_REPO/releases/generate-notes" \
              -f "tag_name=$tag" -f "previous_tag_name=$previous" --jq .body)
          else
            generated=$(gh api "repos/$GH_REPO/releases/generate-notes" -f "tag_name=$tag" --jq .body)
          fi
          {
            if [ -n "$DOCS_VERSION" ]; then
              printf '## Dokumentationsstand %s\n\n' "$DOCS_VERSION"
              if [ -n "$EDULUTION_VERSION" ]; then
                printf 'Dokumentiert edulution %s.\n\n' "$EDULUTION_VERSION"
              fi
              if [ -n "$NOTES" ]; then
                printf '%s\n\n' "$NOTES"
              fi
            fi
            printf '%s\n' "$generated"
          } > "$RUNNER_TEMP/release-notes.md"
          gh release create "$tag" --verify-tag --title "$tag" --notes-file "$RUNNER_TEMP/release-notes.md"
          gh workflow run static.yml --ref "$tag"
          echo "Released $tag and started the deploy." >> "$GITHUB_STEP_SUMMARY"
