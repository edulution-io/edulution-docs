name: Cut docs version

# The documentation has its own release rhythm: a snapshot is cut when the
# state of `docs/` is worth freezing, not whenever edulution ships. Started by
# hand, never by another repository.
#
# The label is the month the snapshot was cut in, counted from zero within that
# month, like the site's own release tags. A second snapshot in the same month
# is therefore `2026.10.1` and leaves `2026.10.0` readable instead of replacing
# it.
#
# Which edulution version a snapshot describes is not derivable from a date, so
# the person cutting it says, and it is recorded in the commit and in the
# release notes.

on:
  workflow_dispatch:
    inputs:
      edulution_version:
        description: 'Documented edulution version (e.g. 2.3)'
        required: true
      notes:
        description: 'What this snapshot changes, in German — it becomes the release notes'
        required: true

permissions:
  contents: read

concurrency:
  group: docs-version
  cancel-in-progress: false

jobs:
  cut:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.cut.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cut the version
        id: cut
        run: |
          set -euo pipefail
          month=$(TZ=Europe/Berlin date +%Y.%-m)

          # The highest snapshot of this month, or -1 when it is the first.
          # `docs:version` unshifts onto versions.json, so the new label has to
          # be the highest one there is, or the site would roll backwards.
          n=-1
          if [ -f versions.json ]; then
            n=$(jq -r --arg prefix "$month." \
              '[.[] | select(startswith($prefix)) | split(".")[2] | select(test("^[0-9]+$")) | tonumber] | max // -1' \
              versions.json)
          fi

          version="$month.$((n + 1))"
          npx docusaurus docs:version "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "::notice::Cut the documentation snapshot $version."

      # Both builds, because the one that is deployed is the one the version
      # options can break: it leaves the development version out. A snapshot
      # that fails here never reaches main, so main is never left with a
      # version that cannot be released.
      - name: Verify the snapshot builds
        run: |
          set -euo pipefail
          npm run build
          DOCS_INCLUDE_NEXT=true npm run build -- --out-dir build-check

      - name: Commit to main
        env:
          VERSION: ${{ steps.cut.outputs.version }}
          EDULUTION_VERSION: ${{ inputs.edulution_version }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add versions.json versioned_docs versioned_sidebars
          git commit -m "Publish the documentation snapshot $VERSION for edulution $EDULUTION_VERSION"
          git push origin main

  # The site is only ever deployed from a release tag, and a push made with GITHUB_TOKEN triggers no
  # workflow, so the snapshot reaches readers through a release of its own rather than through a deploy.
  release:
    needs: cut
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Start the release
        env:
          VERSION: ${{ needs.cut.outputs.version }}
          EDULUTION_VERSION: ${{ inputs.edulution_version }}
          NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          gh workflow run release.yml --ref main \
            -f "docs_version=$VERSION" \
            -f "edulution_version=$EDULUTION_VERSION" \
            -f "notes=$NOTES"
